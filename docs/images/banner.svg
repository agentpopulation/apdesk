<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Agent Population Desk: your own desk of AI agents, on your PC, under your control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1464"/>
      <stop offset="0.45" stop-color="#6a1fd0"/>
      <stop offset="0.78" stop-color="#e0308c"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <g transform="translate(72 70)">
      <rect width="56" height="56" rx="16" fill="#ffffff"/>
      <path d="M16 30 L28 19 L40 30 V40 H32 V33 H24 V40 H16 Z" fill="none" stroke="#3b1aa8" stroke-width="3.2" stroke-linejoin="round"/>
      <text x="74" y="37" font-size="24" font-weight="700" letter-spacing="0.5">AP Desk</text>
    </g>
    <text x="72" y="208" font-size="64" font-weight="800" letter-spacing="-1">Agent Population Desk</text>
    <text x="72" y="258" font-size="27" font-weight="500" opacity="0.95">Your own desk of AI agents. On your PC. Under your control.</text>
    <g transform="translate(72 300)" font-size="18" font-weight="600">
      <g><rect width="88" height="40" rx="20" fill="#ffffff"/><text x="44" y="26" text-anchor="middle" fill="#3b1aa8">Chat</text></g>
      <g transform="translate(100 0)"><rect width="116" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.45"/><text x="58" y="26" text-anchor="middle">Research</text></g>
      <g transform="translate(228 0)"><rect width="88" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.45"/><text x="44" y="26" text-anchor="middle">Tasks</text></g>
      <g transform="translate(328 0)"><rect width="88" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.45"/><text x="44" y="26" text-anchor="middle">Sales</text></g>
      <g transform="translate(428 0)"><rect width="84" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.45"/><text x="42" y="26" text-anchor="middle">Files</text></g>
      <g transform="translate(524 0)"><rect width="100" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.45"/><text x="50" y="26" text-anchor="middle">Agents</text></g>
      <g transform="translate(636 0)"><rect width="100" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.45"/><text x="50" y="26" text-anchor="middle">Models</text></g>
      <g transform="translate(748 0)"><rect width="110" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.45"/><text x="55" y="26" text-anchor="middle">Settings</text></g>
    </g>
    <g transform="translate(966 78)" font-size="17" font-weight="700">
      <rect x="-22" y="-22" width="292" height="290" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35"/>
      <g transform="translate(0 0)"><circle cx="22" cy="22" r="22" fill="#4f9dff"/><text x="22" y="28" text-anchor="middle">C</text><text x="58" y="19" font-size="17">Coordinator</text><text x="58" y="39" font-size="13" font-weight="500" opacity="0.85">Answers and hands out work</text></g>
      <g transform="translate(0 64)"><circle cx="22" cy="22" r="22" fill="#22c58b"/><text x="22" y="28" text-anchor="middle">S</text><text x="58" y="19" font-size="17">Scout</text><text x="58" y="39" font-size="13" font-weight="500" opacity="0.85">Research and reports</text></g>
      <g transform="translate(0 128)"><circle cx="22" cy="22" r="22" fill="#ffb020"/><text x="22" y="28" text-anchor="middle" fill="#3b1aa8">C</text><text x="58" y="19" font-size="17">Closer</text><text x="58" y="39" font-size="13" font-weight="500" opacity="0.85">Leads and drafts</text></g>
      <g transform="translate(0 192)"><circle cx="22" cy="22" r="22" fill="#ff5c7a"/><text x="22" y="28" text-anchor="middle">O</text><text x="58" y="19" font-size="17">Operator</text><text x="58" y="39" font-size="13" font-weight="500" opacity="0.85">Browser and long jobs</text></g>
    </g>
  </g>
